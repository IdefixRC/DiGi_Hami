; ============================================================================
;  DiGi Hami - build configuration
; ============================================================================
;  This project is built with the "pioarduino" extension for VS Code, NOT the
;  classic "PlatformIO IDE" extension. pioarduino is a community fork that
;  tracks the current ESP32 Arduino core (3.x); the classic PlatformIO
;  espressif32 platform lags well behind.
;
;  Extension to install:  pioarduino.pioarduino-ide   (search "pioarduino")
; ============================================================================

[env:esp32-c3-supermini]
; pioarduino platform, pinned for a reproducible V1.0 build.
; To move to a newer ESP32 core later, bump the version in this URL - see
; https://github.com/pioarduino/platform-espressif32/releases
; (or use .../releases/download/stable/platform-espressif32.zip to always
;  track the latest stable release).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; --- ESP32-C3 Super Mini USB settings ---
; Enable USB CDC on boot so the C3 shows up as a serial port and prints its
; Serial output over the USB-C connector.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; The firmware uses the classic SPIFFS API. pioarduino defaults new projects
; to LittleFS, so pin the filesystem back to SPIFFS to match the code.
board_build.filesystem = spiffs

; Automatically upload the SPIFFS image (which holds data/animation.gif)
; straight after the firmware is flashed, so a single "Upload" gives you a
; fully working DiGi Hami. See scripts/upload_fs.py.
; The manual "Upload Filesystem Image" task still works as a fallback.
extra_scripts = post:scripts/upload_fs.py

; --- Libraries used by the sketch ---
; pioarduino downloads these automatically on the first build.
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit GC9A01A
    bitbank2/AnimatedGIF
